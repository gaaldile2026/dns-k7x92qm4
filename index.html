  p{color:#d0d8e0;font-size:15px;line-height:1.5}
  input{width:100%;box-sizing:border-box;margin:14px 0 4px;padding:14px;border-radius:12px;border:1px solid #3a4654;background:rgba(0,0,0,.4);color:#fff;font-size:17px;text-align:center;letter-spacing:4px}
  .btn{display:block;width:100%;box-sizing:border-box;margin:14px 0 8px;padding:14px;background:#2f81f7;color:#fff;border:0;border-radius:12px;text-decoration:none;font-weight:600;font-size:16px}
  #err{color:#ff7b72;font-size:14px;min-height:20px;margin:4px 0 0}
  ol{text-align:left;color:#d0d8e0;font-size:14px;line-height:1.7;padding-left:20px}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>DNS Profile</h1>

  <div id="nosafari" class="hide">
    <p>Boggan waa in lagu furo <b>Safari</b> kaliya.<br>Copy link-ga, ka dibna Safari ku dheji.</p>
  </div>

  <div id="gate" class="hide">
    <p>Geli key-ga</p>
    <input id="key" type="password" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="••••••••" inputmode="text">
    <div id="err"></div>
    <button class="btn" id="go">Sii wad</button>
  </div>

  <div id="ok" class="hide">
    <a class="btn" id="dl" href="#">Download Profile</a>
    <ol>
      <li>Taabo Download, dooro <b>Allow</b></li>
      <li>Taabo <b>Close</b></li>
      <li>Fur <b>Settings → Profile Downloaded</b></li>
      <li>Taabo <b>Install</b></li>
    </ol>
  </div>
</div>
<script>
(function(){
  var CHECK = "e343e601eb67d3a4f490017e7efb4327ed396ef21f96cbc8380bcde00650f0ac";
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua);
  var isSafari = /Safari\//.test(ua) && /Version\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA|FBAN|FBAV|Instagram|Telegram|Line|Snapchat|TikTok|WhatsApp/i.test(ua);
  function $(id){return document.getElementById(id)}
  if(!(isIOS && isSafari)){ $("nosafari").className=""; return; }
  $("gate").className="";
  async function sha(s){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
  }
  async function submit(){
    var k = $("key").value.replace(/[^A-Za-z0-9]/g,"").toUpperCase();
    if(!k){ $("err").textContent="Geli key-ga"; return; }
    var c = await sha("check:"+k);
    if(c !== CHECK){ $("err").textContent="Key-gu waa khalad"; return; }
    var f = (await sha("file:"+k)).slice(0,24) + ".mobileconfig";
    $("dl").href = f;
    $("gate").className="hide";
    $("ok").className="";
  }
  ["paste","copy","cut","drop","contextmenu"].forEach(function(ev){ $("key").addEventListener(ev, function(e){ e.preventDefault(); }); });
  $("go").addEventListener("click", submit);
  $("key").addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
})();
</script>
</body>
</html>
